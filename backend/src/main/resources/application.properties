server.port=8085

# Groq Cloud API Configuration (Ultra-fast LLM inference)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b

# Gemini API Configuration (Secondary Fallback)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# Fallback to intelligent mock mode automatically if API quota is reached
gemini.mock.enabled=false

# Logging
logging.level.com.linkedin.ai=DEBUG
